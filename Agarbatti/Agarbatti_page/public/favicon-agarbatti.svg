<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Metal Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#E5A93B" />
      <stop offset="100%" stop-color="#8C540B" />
    </linearGradient>

    <!-- Masala Paste Gradient -->
    <linearGradient id="favMasala" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2810" />
      <stop offset="50%" stop-color="#7A4822" />
      <stop offset="100%" stop-color="#4A2810" />
    </linearGradient>

    <!-- Glowing Ember Radial -->
    <radialGradient id="favEmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#FF9D00" />
      <stop offset="80%" stop-color="#FF2600" />
      <stop offset="100%" stop-color="#FF1A00" stop-opacity="0" />
    </radialGradient>

    <!-- Smoke Gradient -->
    <linearGradient id="favSmoke" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E68A00" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#D4A759" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#9E783A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8A6324" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Circle Disc (Sacred Crimson with Gold Rim) -->
  <circle cx="32" cy="32" r="30" fill="#7A0C10" />
  <circle cx="32" cy="32" r="28" stroke="url(#favGold)" stroke-width="1.5" fill="#8F0E14" />
  <circle cx="32" cy="32" r="26" stroke="url(#favGold)" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6" fill="none" />

  <!-- Agarbatti Fragrance Smoke Spirals -->
  <path d="M 24 23 C 21 16, 28 11, 25 6" fill="none" stroke="url(#favSmoke)" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 32 20 C 35 14, 29 9, 33 4" fill="none" stroke="url(#favSmoke)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 40 23 C 43 16, 36 11, 39 6" fill="none" stroke="url(#favSmoke)" stroke-width="1.8" stroke-linecap="round" />

  <!-- 3 Incense Sticks -->
  <!-- Left Stick -->
  <line x1="24" y1="24" x2="31" y2="46" stroke="url(#favMasala)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="24" cy="23.5" r="3.2" fill="url(#favEmber)" opacity="0.8" />
  <circle cx="24" cy="23.5" r="1.3" fill="#FFF275" />

  <!-- Right Stick -->
  <line x1="40" y1="24" x2="33" y2="46" stroke="url(#favMasala)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="40" cy="23.5" r="3.2" fill="url(#favEmber)" opacity="0.8" />
  <circle cx="40" cy="23.5" r="1.3" fill="#FFF275" />

  <!-- Center Main Stick -->
  <line x1="32" y1="20" x2="32" y2="46" stroke="url(#favMasala)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="19.5" r="3.8" fill="url(#favEmber)" opacity="0.9" />
  <circle cx="32" cy="19.5" r="1.5" fill="#FFFFB2" />

  <!-- Sacred Golden Lotus Pedestal Stand -->
  <path d="M 32 40 C 29 44, 27 49, 32 53 C 37 49, 35 44, 32 40 Z" fill="url(#favGold)" />
  <path d="M 29 43 C 23 43, 19 47, 28 50 Z" fill="url(#favGold)" />
  <path d="M 35 43 C 41 43, 45 47, 36 50 Z" fill="url(#favGold)" />
  <!-- Base Stand Plinth -->
  <ellipse cx="32" cy="50" rx="10" ry="2.2" fill="url(#favGold)" />
  <rect x="22" y="52" width="20" height="2.5" rx="1.2" fill="url(#favGold)" />
</svg>
